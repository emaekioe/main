plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id "org.openapi.generator" version "7.4.0"
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'io.swagger.core.v3:swagger-annotations:2.2.20'

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.postgresql:postgresql'
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = "$projectDir/src/main/resources/uno-api.yaml".toString()
    outputDir = layout.buildDirectory.dir("generated").get().asFile.toString()
    apiPackage = "de.seriousgames.uno.api"
    modelPackage = "de.seriousgames.uno.model"
    configOptions = [
            interfaceOnly  : "true",
            useSpringBoot3 : "true",
            useTags        : "true",
            openApiNullable: "false"
    ]
}

sourceSets {
    main {
        java {
            srcDirs += "$buildDir/generated/src/main/java"
        }
    }
}

compileJava.dependsOn tasks.openApiGenerate

springBoot {
    mainClass = 'de.seriousgames.SeriousGamesApplication'
}

tasks.register('smokeTest', Test) {
    useJUnitPlatform {
        includeTags 'SmokeTest'
    }
}

tasks.register('integrationTest', Test) {
    useJUnitPlatform {
        includeTags 'IntegrationTest'
    }
}
tasks.register('repositoryTest', Test) {
    useJUnitPlatform {
        includeTags 'RepositoryTest'
    }
}